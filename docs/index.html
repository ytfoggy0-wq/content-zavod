ear, and overfishing poses a major threat to their populations—especially hammerheads, since they grow and reproduce slowly. These iconic creatures are already at the brink of extinction, but successful marine protection initiatives offer a glimpse of hope for the future. \n\n#HammerheadSharksUpClose with @bertiegregory is now streaming on @DisneyPlus and @hulu.", "transcript": " I knew it was possible we might come across shark fishing, but nothing prepares you for seeing it in real life. In Mexico, as in other countries, it's legal to catch sharks. Sharks kill a handful of people every year, yet we humans kill over 100 million sharks. We might need to rethink who should be scared of who. Slow to grow and slow to reproduce, hammerheads are especially vulnerable. We humans have pushed hammerheads to the brink of extinction, but everything I've seen here tells me that we might actually have a chance to make amends. Marine protection works, but now we need to expand it. If not, we can never really protect the hammerhead that ranges far beyond the borders we draw. you", "url": "https://www.instagram.com/reel/DasZY6vgCpu/"}, {"username": "redbull", "posted_at": "2026-07-18", "views": 5097526, "likes": 140298, "score": 1.05, "caption": "and that’s how you keep your shoes clean 👟\n\n🛹: @madarsapse\n\n#redbull #givesyouwiiings #energydrink #skateboarding", "transcript": " Let's see. Let's go. Oh, my God.", "url": "https://www.instagram.com/reel/Da7T8V6OFi3/"}, {"username": "gopro", "posted_at": "2026-07-22", "views": 920694, "likes": 21131, "score": 1.04, "caption": "Uhhh, that’s a cliff?! 🤯 @joshill75’s POV of his 70ft drop is simply insane.\n\n🎥 #GoProHERO13 Black Ultra Wide Edition\n📍 @monsterenergy #FullDescend\n\n@gopromoto #GoPro #GoProMoto #MonsterEnergyFullDescend", "transcript": " Dude, it just looks so f***ing big from up here. Yes!", "url": "https://www.instagram.com/reel/DbGc66ZAdWa/"}, {"username": "uefa", "posted_at": "2026-07-15", "views": 40304, "likes": 53  guide these extraordinary journeys. But some species are adjusting their migrations—National Geographic Explorer Arzucan Askin (@zuzu_askin) explains why.", "transcript": " The little dots you see right there on this shark's snout are called ampullae of Lorenzini and they're a network of mucus-filled pores on the shark's snout that works also like a built-in navigation tool. They might remind you of a cat's whiskers, but they don't respond to touch in the same way. The ampullae of Lorenzini works by picking up on electricity pulsing from other marine life and the Earth's magnetic field, which is pretty crucial because they only see the planet through its ocean And many species of sharks need to navigate across entire ocean basins, sometimes covering distances that are comparable to the Earth's circumference. That's about 25,000 miles. As a shark journeys across the world's ocean, it might encounter fresh food and potential mate, but also threats like industrial fishing fleas, abandoned fishing gear and plastic pollution. And with rising ocean temperatures, we're starting to see some species adjusting their commutes. Like bull sharks, who have been expanding from Florida up to 500 miles north, all the way up to North Carolina. So if you live in these areas, are you ready to meet your new bull shark neighbors?", "url": "https://www.instagram.com/reel/Da8f09SA1ly/"}, {"username": "espn", "posted_at": "2026-07-21", "views": 5909348, "likes": 283127, "score": 1.01, "caption": "A Spanish pilot came over the intercom and trolled Argentina fans into thinking they won. The plane erupted with fans thinking their country had won back-to-back World Cups. Then they realized the pilot was playing them 😂 (via williermina/TT)", "transcript": " Y bueno, ya conocemos el resultado. Nos informan que ha sido un partido muy disputado hasta el final, con prórroga incluida. Los dos equipos lo han dado todo. Pero, la final de un mundial, lamentablemente, solo la puede ganar uno. Desde aquí enough space in space, we don't see much in here. We have our tools that we're going to take out with us. They're ready to go. And this is the EV hatch. Through here we will egress to start the spacewalk and that is the vacuum of space just on the other side. Today I'm going to be getting my spacesuit ready to make sure everything is set to go for Tuesday's spacewalk. Here's my suit and you can see that my tools are all mounted here to the front of the spacesuit. We want to have everything attached to us, and we also want to make sure that everything is tethered so that nothing floats away from us during the spacewalk. Today I'm going to be getting my helmet ready and making sure that everything is in good condition for the spacewalk. Chris Williams and I will be going outside to attempt to fix one of the joints on the Canadarm 2, the robotic arm built by the Canadian Space Agency. This arm has been absolutely vital in constructing the space station. We use it for spacewalks to move things around, sometimes to move us around as well with a spacesuit on the end of the arm. And it also does various other jobs on the space station, for example, moving cargo around when we have cargo vehicles visit. Wish us luck and be sure to tune in on NASA+.", "url": "https://www.instagram.com/reel/DaJgH1_N2UH/"}, {"username": "natgeo", "posted_at": "2026-07-20", "views": 2311989, "likes": 38711, "score": 0.97, "caption": "Whether he's in nature or on the dance floor, there's one food @robertirwinphotography never leaves the house without 🥕 \n\nWatch a new episode of #DWTSNextPro tonight at 8/7c on @abc. Stream next day on @DisneyPlus and @hulu.", "transcript": " Ah, carrots. I love carrots. I'll pack a carrot with me as a snack. Pretty much any animal can eat a carrot. So I know that I can share that carrot with a kangaroo, a giraffe, pretty much anything, a horse, a zebra. Anything's going to like a carrot. Next, I'm going to go with... It's super simple. I love rice. Number three, humans have ever traveled from our home planet, reaching an incredible maximum distance of 252,756 miles from Earth. Simply put the Artemis II mission inspired countless people across our country who joined together to witness history being made once again And now please join me in welcoming our four special guests the astronauts from Artemis 2, Commander Reed Wiseman, Pilot Victor Glover, Mission Specialists Christina Cook, and Jeremy Hansen. Fantastic. Reid, as we celebrate our nation's 250th anniversary, what message do you have about the mission and what lies ahead? Well, Gary, what the four of us just got to do, myself, Victor, Christine, and Jeremy, that was very special. But tonight, we want to thank all of you, folks in the U.S. and around the world because you all showed up for us and we celebrated together. So thank you all. What's coming next here on America's 250th birthday? We have a crew on the International Space Station. We have rovers on Mars. We are sending probes to the moon of Jupiter. We are getting ready to launch Artemis III next year. So tonight, let's just celebrate and enjoy the gifts that this nation has given all of us. Victor what does it mean to you to celebrate our 250th right here at the nation capital Gary it special It special This time is special America will only turn 250 one time. We're in a special place. That building is amazing. That's the people's house. It's a special place. There's a room in there on the wall. It has a scripture that says, where When there is no vision, the people perish. And we love coming here and celebrating, and this is just a really special place to do it. But most important is the people, the special people, all of you that are gathered here today. We love you, and God bless the United States of America. Christina, Christina, what was the most exciting moment of the flight for you? The most exciting moment, I have to say, was not a excitement until Splashdown. That was when our passion was free. Right off the coast of San Diego, we had been focused. Open the top up. We had been focused. We had been, that was awesome. You know the whole mission launch going around the far side of the moon we were so focused on what we were accomplishing but that moment of splashdown was that absolute excitement that we were going to come back we were going to hand the batons to the next crew, and we were going to bring back to this country, to this world, a landing on the moon very soon. So Jeremy, what was it like looking at the moon and when you looked back at Earth? I tell you, just imagine yourself floating there in the Integrity spacecraft with us and seeing the moon up close. And you fall in love with it in a completely new and magical way, seeing all its grandeur, the textures. But then something even more incredible happens. the Earth comes into the window at the same time and you see tiny Earth. And you don't see a country anymore. You just connect with your planet. It's an incredible thing. And I'll just remind you, as you celebrate your 250th, you can be proud, America, of the international collaboration that you led that spread moon joy around the world and reminded us we are better together. all of us appreciate you taking the time out of your busy schedules to be with us here tonight what you did was truly inspiring and we all join in to thank you for coming tonight", "url": "https://www.instagram.com/reel/DaXFaplgnTB/"}, {"username": "nba", "posted_at": "2024-03-22", "views": 248696975, "likes": 10055087, "score": null, "caption": "A lil showtime from the @dallasmavs!!", "transcript": " Keontae George runs into Luka, Luka on the floor, finds Kyrie, fantastic!", "url": "https://www.instagram.com/reel/C4zKaNdRT5Y/"}, {"username": "fifa", "posted_at": "2026-07-19", "views": 1337007, "likes": 73879, "score": null, "caption": "A passionate rendition of Argentina’s national anthem before the @FIFAWorldCup Final 👏🇦🇷", "transcript": " Oh, say can you see, by the dawn's ear anscript": " Thank you for watching!", "url": "https://www.instagram.com/reel/Da_ENkGA6RU/"}]</script>
<script>
  const allData = JSON.parse(document.getElementById('reels-data').textContent);
  const accounts = [...new Set(allData.map(r => r.username))].sort();

  let sortKey = 'score';
  let sortDir = -1;
  let activeAccounts = new Set(accounts);

  const accountChecksEl = document.getElementById('accountChecks');
  accounts.forEach(a => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.value = a;
    cb.addEventListener('change', () => {
      if (cb.checked) activeAccounts.add(a); else activeAccounts.delete(a);
      render();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(a));
    accountChecksEl.appendChild(label);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('minScore').value = 0;
    activeAccounts = new Set(accounts);
    accountChecksEl.querySelectorAll('input').forEach(cb => cb.checked = true);
    render();
  });

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('minScore').addEventListener('input', render);

  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
      render();
    });
  });

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const minScore = parseFloat(document.getElementById('minScore').value) || 0;

    let rows = allData.filter(r => {
      if (!activeAccounts.has(r.username)) return false;
      if ((r.score ?? -1) < minScore) return false;
      if (q && !((r.caption || '').toLowerCase().includes(q) || (r.transcript || '').toLowerCase().includes(q))) return false;
      return true;
    });

    rows.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (va === null || va === undefined) va = sortKey === 'score' ? -Infinity : '';
      if (vb === null || vb === undefined) vb = sortKey === 'score' ? -Infinity : '';
      if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
      return (va - vb) * sortDir;
    });

    document.getElementById('count').textContent = `Роликов: ${rows.length} / ${allData.length}`;

    document.querySelectorAll('thead th[data-key]').forEach(th => {
      th.querySelector('.arrow')?.remove();
      if (th.dataset.key === sortKey) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = sortDir === -1 ? '↓' : '↑';
        th.appendChild(arrow);
      }
    });

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td class="username">${escapeHtml(r.username)}</td>
        <td class="num">${r.posted_at || ''}</td>
        <td class="num">${(r.views ?? '').toLocaleString('ru-RU')}</td>
        <td class="num">${(r.likes ?? '').toLocaleString('ru-RU')}</td>
        <td class="score">${r.score !== null ? r.score.toFixed(2) : '—'}</td>
        <td class="text"><div class="clamp">${escapeHtml(r.caption)}</div></td>
        <td class="text"><div class="clamp">${escapeHtml(r.transcript)}</div></td>
        <td class="link"><a href="${r.url}" target="_blank" rel="noopener">Открыть</a></td>
      </tr>
    `).join('');
  }

  render();
</script>
</body>
